name: 每日抓取台股資料

on:
  schedule:
    # 週一到週五 08:40 UTC = 台灣時間 16:40（三大法人資料收盤後才公布）
    - cron: "40 8 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "回補最近幾個交易日（0 = 只抓今天）"
        required: false
        default: "0"

permissions:
  contents: write   # 讓工作流程能把新資料 commit 回 repo

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 測試
        run: python -m pytest -q

      - name: 回補歷史
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.backfill_days != '0'
        run: python -m screener backfill --days ${{ github.event.inputs.backfill_days }}

      - name: 抓今天
        run: python -m screener fetch

      - name: 資料概況
        if: always()
        run: python -m screener status

      - name: 存回 repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d data ]; then echo "沒有資料可存"; exit 0; fi
          git add data
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "data: $(TZ=Asia/Taipei date +%F)"
            for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 10; done
            exit 1
          fi
